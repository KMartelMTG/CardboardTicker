name: Backfill 90-day history

on:
  workflow_dispatch: {}   # manual only — run once

permissions:
  contents: write

concurrency:
  group: daily-snapshot   # never overlap with the daily run
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt ijson

      - name: Backfill from MTGJSON
        run: python backfill.py

      - name: Rebuild site data over full history
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily.py

      - name: Commit history + site data
        run: |
          git config user.name "mtg-tracker-bot"
          git config user.email "mtg-tracker-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "backfill 90-day history from MTGJSON"
          git push
